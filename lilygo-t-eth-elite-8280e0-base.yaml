###############################################################################
# BASE DEVICE CONFIG ##########################################################
###############################################################################

substitutions:
  name: lilygo-t-eth-elite-8280e0
  friendly_name: LilyGo T-ETH-Elite 8280e0 Base

#packages:
#  - !include common/package_wifi.yaml
#  - !include common/package_ha_base.yaml

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

###############################################################################

# # Ethernet (T-ETH-ELite)
ethernet:
  type: W5500
  clk_pin: GPIO48
  mosi_pin: GPIO21
  miso_pin: GPIO47
  cs_pin: GPIO45
  interrupt_pin: GPIO14
  #reset_pin: GPIOXX

# Enable Home Assistant API
api:

ota:
  platform: esphome

# Enable logging
logger:

