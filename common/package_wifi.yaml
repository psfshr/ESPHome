###############################################################################
# WIFI
# WiFi Configuration
###############################################################################
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
#  ap:
#    ssid: ${name}
#    password: ${name}
  power_save_mode: NONE
  on_connect:
    - logger.log: "WiFi connected"
  on_disconnect:
    - logger.log: "WiFI disconnected"

#captive_portal:

api:

ota:
  platform: esphome

logger:

###############################################################################
# DEVICE SENSORS
# Device sensors which get pushed into Home Assistant
###############################################################################
sensor:
    #Device RSSI
  - platform: wifi_signal
    name: RSSI
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"