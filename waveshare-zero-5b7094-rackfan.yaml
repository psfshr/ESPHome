
# https://github.com/patrickcollins12/esphome-fan-controller/blob/master/console-fan.yaml





###############################################################################
# BASE DEVICE CONFIG ##########################################################
###############################################################################

substitutions:
  name: waveshare-zero-5b7094
  friendly_name: WaveShare Zero 5b7094 Rack Fan

packages:
  - !include common/package_wifi.yaml
  - !include common/package_ha_base.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32_S3_BOX_BOARD: "y"
   
psram:
  mode: quad
  speed: 80MHz

# Enable logging
logger:


###############################################################################
# INPUTS & OUTPUTS ############################################################
###############################################################################

output:
  - platform: ledc
    pin: 25
    id: fan_pwm
    frequency: 25000 Hz    # above audible range

fan:
  - platform: speed
    output: fan_pwm
    name: $friendly_name Fan
    speed_count: 100
    min_power: 10%
    max_power: 80%
    zero_means_zero: true


###############################################################################
# VARIABLES & SCRIPTS #########################################################
###############################################################################



###############################################################################
# HOME ASSISTANT BUTTONS ######################################################
###############################################################################

#button:

###############################################################################
# SENSORS #####################################################################
###############################################################################

# binary_sensor:

# text_sensor:

sensor:

  - platform: pulse_counter
    pin: 
      number: GPIO25
      mode: INPUT_PULLUP
    unit_of_measurement: 'RPM'
    id: fan_speed
    name: $friendly_name Fan Speed
    accuracy_decimals: 0
    filters:
      - multiply: 0.5
    count_mode:
      rising_edge: INCREMENT
      falling_edge: DISABLE
