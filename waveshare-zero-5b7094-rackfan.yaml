
# https://github.com/patrickcollins12/esphome-fan-controller/blob/master/console-fan.yaml
# https://github.com/nordeep/esphome_fan_controller/blob/main/fanmaster.yaml
# https://github.com/joshuaboniface/smart-pwm-fan-controller/blob/master/fan-controller.yaml

# https://github.com/zeroflow/wifi-fancontroller/blob/main/modules/temperature_linear.yaml

# A 4-pin PWM fan uses
# Pin 1 for ground (black) - to PSU on black
# Pin 2 for +12 V power (yellow) -to PSU on white
# Pin 3 for tachometer speed feedback (green) - to ESP32 on yellow GP1
# Pin 4 for PWM control (blue) - to ESP32 on orange GP2


# https://passionelectronique.fr/tutorial-bme280/

# Red - VCC
# Brown - GND
# Orange - SCL - 7 - SCK - Serial Clock - CLK
# Yellow - SDA - 8 - SDI - MOSI
# Green - CSB - 9 - CSL - Chip Select - CS
# Blue - SDO - 10 - SDO - Serial Data Out - MISO


###############################################################################
# BASE DEVICE CONFIG ##########################################################
###############################################################################

substitutions:
  name: waveshare-zero-5b7094
  friendly_name: WaveShare Zero 5b7094 Rack Fan

packages:
  - !include common/package_wifi.yaml
  - !include common/package_ha_base.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32_S3_BOX_BOARD: "y"
   
psram:
  mode: quad
  speed: 80MHz

# Enable logging
logger:


###############################################################################
# INPUTS & OUTPUTS ############################################################
###############################################################################

# https://esphome.io/components/spi/
spi:
  clk_pin: 7
  mosi_pin: 8
  miso_pin: 10


output:
  - platform: ledc
    pin: 02
    id: fan_pwm
    frequency: 25000 Hz    # above audible range

fan:
  - platform: speed
    output: fan_pwm
    name: $friendly_name Fan
    speed_count: 10
    restore_mode: RESTORE_DEFAULT_ON


###############################################################################
# VARIABLES & SCRIPTS #########################################################
###############################################################################



###############################################################################
# HOME ASSISTANT BUTTONS ######################################################
###############################################################################

#button:

###############################################################################
# SENSORS #####################################################################
###############################################################################

# binary_sensor:

# text_sensor:

sensor:

  - platform: pulse_counter
    pin: 
      number: 01
      inverted: false
      mode: INPUT_PULLUP        # Pull-up is required for fan tach readings
    count_mode:
      rising_edge: INCREMENT    # Count only the rising edge of each tick
      falling_edge: DISABLE     # Falling edges might result in lingering values
    use_pcnt: true              # Use the hardware pulse counter explicitly
    unit_of_measurement: 'RPM'
    id: fan_speed
    name: $friendly_name Fan Speed
    update_interval: 5s 
    accuracy_decimals: 0
    filters:
      - multiply: 0.5

  # https://esphome.io/components/sensor/bme280/
  - platform: bme280_spi
    temperature:
      name: $friendly_name Temperature
    pressure:
      name: $friendly_name Pressure
    humidity:
      name: $friendly_name Humidity
    cs_pin: 9
